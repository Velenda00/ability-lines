<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#f7f4f0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <title>再塑法典</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topBar">
    <h1 id="pageTitle">再塑法典</h1>
    <span id="menuBtn" onclick="toggleMenu()">⋯</span>
  </header>
  <div id="dropdownMenu" class="dropdown hidden">
    <div onclick="showSyncSettingsModal()">⚙️ 同步设置</div>
    <div onclick="Sync.pull()" style="color:var(--color-primary);font-weight:500">⬇️ 从云端拉取</div>
    <div onclick="Sync.push()" style="color:var(--color-primary);font-weight:500">⬆️ 推送到云端</div>
    <div onclick="showBackupListModal()">🔙 恢复备份</div>
    <div style="border-top:1px solid var(--bg-inset);margin:6px 0"></div>
    <div onclick="showNameConfigModal()">✏️ 修改命名</div>
    <div onclick="exportJSON()">📤 导出 JSON</div>
    <div onclick="exportMarkdown()">📝 导出 Markdown</div>
    <div onclick="document.getElementById('importInput').click()">📥 导入数据</div>
    <input type="file" id="importInput" accept=".json" style="display:none">
  </div>
  <main id="mainContent">
    <!-- 首页 -->
    <section id="page-home" class="page active"></section>

    <!-- 能力（合并解放脑+独立自主+外交墙） -->
    <section id="page-ability" class="page">
      <div class="page-header" style="justify-content:space-between">
        <span id="pageTitleA" class="page-title-text">💪 能力</span>
        <span></span>
      </div>
      <div class="tab-bar" id="abilityTabs" style="margin-bottom:12px"></div>
      <div id="abilityContent" class="entry-list"></div>
    </section>

    <!-- 执行（待办+习惯合并） -->
    <section id="page-action" class="page">
      <div class="page-header">
        <span class="page-title-text">⚡ 执行</span>
        <span style="width:36px"></span>
      </div>
      <div class="tab-bar" id="actionTabs" style="margin-bottom:12px"></div>
      <div id="actionContent"></div>
    </section>

    <!-- 思绪 -->
    <section id="page-thoughts" class="page">
      <div class="page-header">
        <span class="page-title-text">💭 思绪</span>
        <span style="width:36px"></span>
      </div>
      <div class="search-bar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
        </svg>
        <input id="thoughtSearch" type="text" placeholder="搜索思绪或标签..." oninput="renderThoughts()">
      </div>
      <div id="thoughtTagsBar" style="margin-bottom:8px"></div>
      <div id="thoughtList" class="entry-list"></div>
    </section>

    <!-- 工作 -->
    <section id="page-work" class="page">
      <div class="page-header" style="justify-content:space-between">
        <span id="workTitle" class="page-title-text">🛤️ 工作</span>
        <button class="work-export-btn" onclick="showWorkExportModal()">📤</button>
      </div>
      <div id="workViewContainer">
        <div id="workOverview" class="work-view active"></div>
        <div id="workFocus" class="work-view"></div>
      </div>
    </section>

    <!-- 专项详情 V2 -->
    <section id="page-project" class="page">
      <div class="page-header">
        <button class="back-btn" onclick="switchPage('ability')">←</button>
        <span id="projectTitle" class="page-title-text">专项详情</span>
        <span style="width:36px"></span>
      </div>
      <div id="projectStats" class="proj-stats"></div>
      <div id="projectContent"></div>
      <div id="projectFab" class="proj-fab-wrap"></div>
    </section>
  </main>

  <!-- 页面级 FAB 按钮 -->
  <button class="page-fab" id="fab-ability" onclick="handleAbilityFab()">+</button>
  <button class="page-fab" id="fab-action" onclick="showActionFabMenu()">+</button>
  <button class="page-fab" id="fab-thoughts" onclick="showAddThoughtModal()">+</button>
  <button class="page-fab" id="fab-work" onclick="showAddWorkEventModal()">+</button>

  <!-- 底部导航（5项，SVG 图标） -->
  <nav id="bottomNav">
    <div class="nav-item active" onclick="switchPage('home')">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
      <span class="nav-label">首页</span>
    </div>
    <div class="nav-item" onclick="switchPage('ability')">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></span>
      <span class="nav-label">能力</span>
    </div>
    <div class="nav-item" onclick="switchPage('action')">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></span>
      <span class="nav-label">执行</span>
    </div>
    <div class="nav-item" onclick="switchPage('thoughts')">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 109 20h9a5 5 0 000-10z"/></svg></span>
      <span class="nav-label">思绪</span>
    </div>
    <div class="nav-item" onclick="switchPage('work')">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/><line x1="12" y1="12" x2="12" y2="12.01"/><line x1="12" y1="16" x2="12" y2="16.01"/></svg></span>
      <span class="nav-label">工作</span>
    </div>
  </nav>

  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/sync.js"></script>
  <script>if('serviceWorker'in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}</script>
</body>
</html>
