<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#f5f0eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <title>再塑法典</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topBar">
    <h1 id="pageTitle">再塑法典</h1>
    <span id="menuBtn" onclick="toggleMenu()">⋯</span>
  </header>
  <div id="dropdownMenu" class="dropdown hidden">
    <div onclick="showSyncSettingsModal()">⚙️ 同步设置</div>
    <div onclick="Sync.pull()" style="color:#5a7d6b;font-weight:500">⬇️ 从云端拉取</div>
    <div onclick="Sync.push()" style="color:#5a7d6b;font-weight:500">⬆️ 推送到云端</div>
    <div onclick="showBackupListModal()">🔙 恢复备份</div>
    <div style="border-top:1px solid #e0d8d0;margin:6px 0"></div>
    <div onclick="showNameConfigModal()">✏️ 修改命名</div>
    <div onclick="exportJSON()">📤 导出 JSON</div>
    <div onclick="exportMarkdown()">📝 导出 Markdown</div>
    <div onclick="document.getElementById('importInput').click()">📥 导入数据</div>
    <input type="file" id="importInput" accept=".json" style="display:none">
  </div>
  <main id="mainContent">
    <!-- 首页 -->
    <section id="page-home" class="page active"></section>

    <!-- 能力（合并解放脑+独立自主+外交墙） -->
    <section id="page-ability" class="page">
      <div class="page-header" style="justify-content:space-between">
        <span id="pageTitleA" class="page-title-text">💪 能力</span>
        <span></span>
      </div>
      <div class="tab-bar" id="abilityTabs" style="margin-bottom:12px"></div>
      <div id="abilityContent" class="entry-list"></div>
    </section>

    <!-- 目标 -->
    <section id="page-goals" class="page">
      <div class="page-header">
        <span class="page-title-text">🎯 目标</span>
        <button class="add-btn" onclick="showAddGoalModal()">+</button>
      </div>
      <div id="goalsList" class="entry-list"></div>
    </section>

    <!-- 思绪 -->
    <section id="page-thoughts" class="page">
      <div class="page-header">
        <span class="page-title-text">💭 思绪</span>
        <button class="add-btn" onclick="showAddThoughtModal()">+</button>
      </div>
      <div style="margin-bottom:10px">
        <input id="thoughtSearch" type="text" placeholder="🔍 搜索思绪或标签..." style="width:100%;padding:10px 14px;border:1px solid #e0d8d0;border-radius:10px;font-size:14px;outline:none;background:#fff" oninput="renderThoughts()">
      </div>
      <div id="thoughtList" class="entry-list"></div>
    </section>

    <!-- 待办 -->
    <section id="page-todos" class="page">
      <div class="page-header">
        <span class="page-title-text">📋 待办</span>
        <button class="add-btn" onclick="showAddTodoModal()">+</button>
      </div>
      <div id="todoContent"></div>
    </section>

    <!-- 专项详情 -->
    <section id="page-project" class="page">
      <div class="page-header">
        <button class="back-btn" onclick="switchPage('ability')">←</button>
        <span id="projectTitle" class="page-title-text">专项详情</span>
        <span style="width:36px"></span>
      </div>
      <div class="tab-bar" id="projectTabs"></div>
      <div id="projectContent" class="entry-list"></div>
    </section>
  </main>

  <!-- 底部导航（5项） -->
  <nav id="bottomNav">
    <div class="nav-item active" onclick="switchPage('home')"><span class="nav-icon">🏠</span><span class="nav-label">首页</span></div>
    <div class="nav-item" onclick="switchPage('ability')"><span class="nav-icon">💪</span><span class="nav-label">能力</span></div>
    <div class="nav-item" onclick="switchPage('goals')"><span class="nav-icon">🎯</span><span class="nav-label">目标</span></div>
    <div class="nav-item" onclick="switchPage('thoughts')"><span class="nav-icon">💭</span><span class="nav-label">思绪</span></div>
    <div class="nav-item" onclick="switchPage('todos')"><span class="nav-icon">📋</span><span class="nav-label">待办</span></div>
  </nav>

  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/sync.js"></script>
  <script>if('serviceWorker'in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}</script>
</body>
</html>
